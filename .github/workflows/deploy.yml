name: ShieldGuard Pro CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run health check
        run: |
          python -c "import flask; import sklearn; import numpy; import pandas; print('✅ All imports OK')"

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build -t abhiishek25/shieldguard-pro:latest .
          docker push abhiishek25/shieldguard-pro:latest
          echo "✅ Image pushed to Docker Hub!"

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/"

      - name: Deploy and Configure .env on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          envs: SECRET_KEY,JWT_SECRET_KEY,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,GH_OAUTH_CLIENT_ID,GH_OAUTH_CLIENT_SECRET,ADMIN_PASSWORD,MAIL_USERNAME,MAIL_PASSWORD,MAIL_SERVER,MAIL_PORT,MAIL_USE_TLS,GOOGLE_SAFE_BROWSING_API_KEY,GEMINI_API_KEY
          script: |
            printf "SECRET_KEY=%s\n"           "$SECRET_KEY"               > ~/.env
            printf "JWT_SECRET_KEY=%s\n"       "$JWT_SECRET_KEY"           >> ~/.env
            printf "DATABASE_URL=postgresql://%s:%s@db:5432/%s\n" "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" >> ~/.env
            printf "POSTGRES_DB=%s\n"          "$POSTGRES_DB"              >> ~/.env
            printf "POSTGRES_USER=%s\n"        "$POSTGRES_USER"            >> ~/.env
            printf "POSTGRES_PASSWORD=%s\n"    "$POSTGRES_PASSWORD"        >> ~/.env
            printf "REDIS_URL=redis://redis:6379/0\n"                      >> ~/.env
            printf "FLASK_APP=app.py\n"                                    >> ~/.env
            printf "FLASK_ENV=production\n"                                >> ~/.env
            printf "ADMIN_PASSWORD=%s\n"       "$ADMIN_PASSWORD"           >> ~/.env
            printf "GITHUB_CLIENT_ID=%s\n"     "$GH_OAUTH_CLIENT_ID"      >> ~/.env
            printf "GITHUB_CLIENT_SECRET=%s\n" "$GH_OAUTH_CLIENT_SECRET"  >> ~/.env
            printf "APP_BASE_URL=https://shieldguard-pro.duckdns.org\n"    >> ~/.env
            printf "MAIL_USERNAME=%s\n"        "$MAIL_USERNAME"            >> ~/.env
            printf "MAIL_PASSWORD=%s\n"        "$MAIL_PASSWORD"            >> ~/.env
            printf "MAIL_SERVER=%s\n"          "${MAIL_SERVER:-smtp.gmail.com}" >> ~/.env
            printf "MAIL_PORT=%s\n"            "${MAIL_PORT:-587}"         >> ~/.env
            printf "MAIL_USE_TLS=%s\n"         "${MAIL_USE_TLS:-True}"     >> ~/.env
            printf "GOOGLE_SAFE_BROWSING_API_KEY=%s\n" "$GOOGLE_SAFE_BROWSING_API_KEY" >> ~/.env
            printf "GEMINI_API_KEY=%s\n"               "$GEMINI_API_KEY"               >> ~/.env
            printf "ENABLE_EXTERNAL_URL_FEATURES=true\n"                   >> ~/.env

            mv ~/docker-compose.prod.yml ~/docker-compose.yml
            cd ~
            docker-compose down
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f
            echo "✅ Deployed successfully!"
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USE_TLS: ${{ secrets.MAIL_USE_TLS }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}