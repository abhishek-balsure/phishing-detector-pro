{% extends "base.html" %}

{% block title %}Page Not Found - ShieldGuard Pro{% endblock %}

{% block extra_css %}
<style>
    .error-page {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        position: relative;
        overflow: hidden;
    }

    .error-card {
        max-width: 600px;
        width: 100%;
        background: var(--bg-card);
        border-radius: 24px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
        position: relative;
        z-index: 1;
        overflow: hidden;
        text-align: center;
        padding: 3rem 2rem;
    }

    .error-icon {
        width: 100px;
        height: 100px;
        background: rgba(99, 102, 241, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 3.5rem;
        color: var(--primary);
        animation: float-search 3s ease-in-out infinite;
    }

    @keyframes float-search {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(10deg); }
    }

    .error-code {
        font-size: 4rem;
        font-weight: 900;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
        line-height: 1;
    }

    .error-title {
        font-weight: 800;
        font-size: 1.75rem;
        margin-bottom: 1rem;
        color: var(--text-primary);
    }

    .error-desc {
        color: var(--text-secondary);
        font-size: 1.1rem;
        margin-bottom: 2.5rem;
        max-width: 80%;
        margin-left: auto;
        margin-right: auto;
    }

    .btn-home {
        height: 52px;
        padding: 0 2rem;
        font-size: 1.05rem;
        font-weight: 700;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        border: none;
        color: white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 8px 25px var(--primary-glow);
    }

    .btn-home:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 35px var(--shadow-blue);
        color: white;
    }

    body.dark-mode .error-card {
        background: rgba(26, 26, 46, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
</style>
{% endblock %}

{% block content %}
<div class="error-page fade-in">
    <div class="error-card fade-up">
        <div class="error-icon">
            <i class="bi bi-search"></i>
        </div>
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">
            The page you're looking for doesn't exist or has been moved. Let's get you back on track.
        </p>
        
        <a href="{{ url_for('index') }}" class="btn-home">
            <i class="bi bi-house-door"></i>
            <span>Go Home</span>
        </a>
    </div>
</div>
{% endblock %}
